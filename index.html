<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca WebAR Anchor - Este</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }

        .hide-scanning .mindar-ui-scanning {
            display: none !important;
        }
    </style>
</head>

<body>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity
            id="target"
            mindar-image-target="targetIndex: 0">

            <a-entity
                id="placement"
                position="0.95 0 0.05"
                rotation="0 0 0"
                scale="0.16 0.16 0.16">

                <!-- Модель теперь ЖИВЁТ внутри маркера, а не копируется в корень сцены.
                     MindAR сам обновляет трансформацию #target каждый кадр,
                     поэтому модель будет корректно "стоять на месте" в пространстве
                     всё то время, пока маркер трекается — можно свободно обходить её вокруг. -->
                <a-gltf-model
                    id="archModel"
                    src="./arcageo.glb">
                </a-gltf-model>

            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const archModel = document.querySelector('#archModel');
        const target = document.querySelector('#target');

        archModel.addEventListener('model-loaded', () => {
            console.log('GLB успешно загружен');
        });

        archModel.addEventListener('model-error', event => {
            console.error('Ошибка загрузки GLB:', event.detail || event);
        });

        target.addEventListener('targetFound', () => {
            console.log('Маркер найден');
        });

        target.addEventListener('targetLost', () => {
            console.log('Маркер потерян');
        });
    </script>
</body>
</html>
