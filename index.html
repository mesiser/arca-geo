<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca AR - Настоящий масштаб</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f4f4f4;
        }
        /* Растягиваем вьювер на весь экран */
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <model-viewer
        src="arcageo.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        shadow-intensity="1"
        environment-image="neutral"
        auto-rotate>
    </model-viewer>

</body>
</html>
